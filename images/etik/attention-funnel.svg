<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <style>
    .label { font-family: Georgia, serif; font-size: 18px; fill: #222; text-anchor: middle; }
    .sublabel { font-family: Georgia, serif; font-size: 13px; fill: #666; text-anchor: middle; font-style: italic; }
    .caption { font-family: Georgia, serif; font-size: 13px; fill: #444; text-anchor: middle; font-style: italic; }
    .title { font-family: Georgia, serif; font-size: 22px; fill: #222; text-anchor: middle; font-weight: bold; }
    .normal-dot { fill: #7a9eb8; opacity: 0.7; }
    .care-dot { fill: #c9331b; opacity: 0.85; }
    .normal-funnel { fill: none; stroke: #7a9eb8; stroke-width: 2; }
    .care-funnel { fill: none; stroke: #c9331b; stroke-width: 3; }
    .focus-arrow { fill: #c9331b; }
  </style>

  <text x="450" y="30" class="title">Two modes of attention</text>
  <text x="450" y="55" class="caption">Many candidates competing vs. one priority collapsing the field</text>

  <!-- NORMAL MODE (left) -->
  <g transform="translate(60, 90)">
    <text x="170" y="0" class="label">Normal mode</text>
    <text x="170" y="20" class="sublabel">many things, scattered</text>

    <!-- Wide funnel (right-opening trapezoid pointing down) -->
    <path class="normal-funnel" d="M 40 60 L 300 60 L 220 280 L 120 280 Z" />
    <!-- Dotted lines inside to suggest "many options" -->
    <line x1="60" y1="80" x2="290" y2="80" stroke="#7a9eb8" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.5" />
    <line x1="70" y1="110" x2="280" y2="110" stroke="#7a9eb8" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.5" />
    <line x1="80" y1="140" x2="270" y2="140" stroke="#7a9eb8" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.5" />
    <line x1="90" y1="170" x2="260" y2="170" stroke="#7a9eb8" stroke-width="0.5" stroke-dasharray="2,3" opacity="0.5" />

    <!-- Many small dots representing candidates -->
    <circle class="normal-dot" cx="100" cy="95" r="4" />
    <circle class="normal-dot" cx="135" cy="105" r="4" />
    <circle class="normal-dot" cx="170" cy="90" r="4" />
    <circle class="normal-dot" cx="205" cy="100" r="4" />
    <circle class="normal-dot" cx="240" cy="95" r="4" />
    <circle class="normal-dot" cx="120" cy="125" r="4" />
    <circle class="normal-dot" cx="160" cy="135" r="4" />
    <circle class="normal-dot" cx="195" cy="125" r="4" />
    <circle class="normal-dot" cx="230" cy="135" r="4" />
    <circle class="normal-dot" cx="100" cy="155" r="4" />
    <circle class="normal-dot" cx="140" cy="165" r="4" />
    <circle class="normal-dot" cx="180" cy="155" r="4" />
    <circle class="normal-dot" cx="220" cy="165" r="4" />
    <circle class="normal-dot" cx="255" cy="160" r="4" />
    <circle class="normal-dot" cx="115" cy="195" r="4" />
    <circle class="normal-dot" cx="155" cy="205" r="4" />
    <circle class="normal-dot" cx="195" cy="195" r="4" />
    <circle class="normal-dot" cx="235" cy="205" r="4" />
    <circle class="normal-dot" cx="130" cy="235" r="4" />
    <circle class="normal-dot" cx="170" cy="245" r="4" />
    <circle class="normal-dot" cx="210" cy="240" r="4" />
    <circle class="normal-dot" cx="155" cy="270" r="4" />
    <circle class="normal-dot" cx="190" cy="275" r="4" />

    <!-- Bottom: arrows fanning out (multiple possibilities emerge) -->
    <line x1="170" y1="295" x2="100" y2="335" stroke="#7a9eb8" stroke-width="1" opacity="0.6" />
    <line x1="170" y1="295" x2="140" y2="335" stroke="#7a9eb8" stroke-width="1" opacity="0.6" />
    <line x1="170" y1="295" x2="170" y2="340" stroke="#7a9eb8" stroke-width="1" opacity="0.6" />
    <line x1="170" y1="295" x2="200" y2="335" stroke="#7a9eb8" stroke-width="1" opacity="0.6" />
    <line x1="170" y1="295" x2="240" y2="335" stroke="#7a9eb8" stroke-width="1" opacity="0.6" />

    <text x="170" y="365" class="caption">multiple candidates → multiple responses</text>
  </g>

  <!-- CARE MODE (right) -->
  <g transform="translate(490, 90)">
    <text x="170" y="0" class="label">Care mode</text>
    <text x="170" y="20" class="sublabel">one priority, collapsed</text>

    <!-- Narrow funnel -->
    <path class="care-funnel" d="M 110 60 L 230 60 L 200 280 L 140 280 Z" />

    <!-- Faded background dots (the suppressed candidates) -->
    <circle cx="130" cy="100" r="3" fill="#cccccc" opacity="0.5" />
    <circle cx="170" cy="95" r="3" fill="#cccccc" opacity="0.5" />
    <circle cx="210" cy="105" r="3" fill="#cccccc" opacity="0.5" />
    <circle cx="145" cy="140" r="3" fill="#cccccc" opacity="0.5" />
    <circle cx="195" cy="135" r="3" fill="#cccccc" opacity="0.5" />
    <circle cx="155" cy="180" r="3" fill="#cccccc" opacity="0.5" />
    <circle cx="185" cy="175" r="3" fill="#cccccc" opacity="0.5" />
    <circle cx="165" cy="225" r="3" fill="#cccccc" opacity="0.5" />

    <!-- ONE bright focused dot in the funnel -->
    <circle class="care-dot" cx="170" cy="200" r="9" />
    <circle class="care-dot" cx="170" cy="200" r="14" fill="none" stroke="#c9331b" stroke-width="1.5" opacity="0.5" />
    <circle class="care-dot" cx="170" cy="200" r="20" fill="none" stroke="#c9331b" stroke-width="1" opacity="0.3" />

    <!-- ONE arrow straight down (priority already determined) -->
    <line x1="170" y1="295" x2="170" y2="340" class="focus-arrow" stroke="#c9331b" stroke-width="3" />

    <text x="170" y="365" class="caption">one priority → response already constructed</text>
  </g>

  <!-- Adrenaline analogy at bottom -->
  <text x="450" y="440" class="caption" style="font-size:12px;">Human parallel: the tunnel vision of an adrenaline spike — a light version, with the priority already clear before the words arrive.</text>
</svg>